<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVERYWEAR | Premium Fashion Destination</title>
    <meta name="description" content="Discover contemporary fashion at EVERYWEAR. Premium quality clothing and accessories for the modern individual." />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- DNS prefetch for external image & API hosts — eliminates the DNS lookup delay on first request -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload the hero image (LCP element) so it starts downloading immediately -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=1920&h=1080&fit=crop&q=85"
      fetchpriority="high"
    />

    <!-- Inline critical CSS to prevent FOUC on first paint -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root { color-scheme: light dark; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: hsl(0 0% 100%); }
      html.dark body { background: hsl(222 48% 5%); }
      #root { min-height: 100vh; }
      /* Prevent invisible text during font load */
      body { font-display: swap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
