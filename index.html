<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVERYWEAR | Premium Fashion Destination</title>
    <meta name="description" content="Discover contemporary, minimalist fashion at EVERYWEAR. Premium quality clothing and curated accessories designed for the modern individual. Experience luxury craftsmanship delivered globally." />
    <meta name="keywords" content="EVERYWEAR, premium fashion, minimalist clothing, luxury apparel, contemporary design, fashion destination" />
    <meta name="author" content="EVERYWEAR" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://everywear.com/" />
    <meta property="og:title" content="EVERYWEAR | Premium Fashion Destination" />
    <meta property="og:description" content="Discover contemporary, minimalist fashion at EVERYWEAR. Premium quality clothing and curated accessories." />
    <meta property="og:image" content="https://everywear.com/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://everywear.com/" />
    <meta property="twitter:title" content="EVERYWEAR | Premium Fashion Destination" />
    <meta property="twitter:description" content="Discover contemporary, minimalist fashion at EVERYWEAR. Premium quality clothing and curated accessories." />
    <meta property="twitter:image" content="https://everywear.com/og-image.png" />

    <!-- DNS prefetch for external image & API hosts — eliminates the DNS lookup delay on first request -->
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />

    <!-- Preload the hero image (LCP element) so it starts downloading immediately -->
    <link
      rel="preload"
      as="image"
      href="/assets/images/hero-premium.png"
      fetchpriority="high"
    />

    <!-- Inline critical CSS to prevent FOUC on first paint -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      :root { color-scheme: light dark; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: hsl(0 0% 100%); }
      html.dark body { background: hsl(240 10% 3.9%); }
      #root { min-height: 100vh; }
      /* Prevent invisible text during font load */
      body { font-display: swap; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
